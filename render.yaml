services:
  - type: web
    name: ideahub-web
    env: python
    region: oregon
    branch: main
    buildCommand: pip install --disable-pip-version-check -r requirements.txt
    startCommand: gunicorn --worker-class gthread -w 1 --threads 100 app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        value: "<set-this-in-render>"
      - key: DATABASE_URL
        value: "<railway-mysql-connection-string>"
      - key: CORS_ORIGINS
        value: "https://<your-render-service>.onrender.com"
    disk:
      mountPath: /tmp/uploads
      sizeGB: 1
