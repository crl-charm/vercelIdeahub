{% extends "layout.html" %}

{% block title %}Reservations - IdeaHub{% endblock %}

{% block content %}

<div class="container-fluid">
  <div class="d-flex flex-column flex-md-row justify-content-md-between align-items-md-center gap-3 mb-4">
    <div>
      <h3 class="mb-0">Space Reservations</h3>
      <small id="reservations-count" class="text-muted">0 records</small>
    </div>
    <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#addResModal">
      + New Reservation
    </button>
  </div>

  <!-- Desktop Table View -->
  <div class="card d-none d-md-block">
    <div class="card-header">
      <h5 class="mb-0">All Reservations</h5>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Contact</th>
              <th>Space</th>
              <th>Date</th>
              <th>Time</th>
              <th>Duration</th>
              <th>People</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reservations-body">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Mobile Card View -->
  <div class="d-md-none" id="reservations-card-container">
    <p class="text-center text-muted py-4">Loading...</p>
  </div>
</div>

<!-- Add Reservation Modal -->
<div class="modal fade" id="addResModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Reservation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Customer Name *</label>
          <input type="text" id="customerName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contact</label>
          <input type="text" id="customerContact" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Space *</label>
          <select id="spaceTypeId" class="form-select" required>
            <option value="">Select space...</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Date *</label>
          <input type="date" id="reservedDate" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Time *</label>
          <input type="time" id="reservedTime" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Duration (minutes) *</label>
          <input type="number" id="duration" class="form-control" value="60" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Number of People *</label>
          <input type="number" id="numPeople" class="form-control" value="1" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Notes</label>
          <textarea id="notes" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-warning" onclick="createReservation()">Create</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  loadSpaces();
  loadReservations();
});

function loadSpaces() {
  fetch('/admin/reservations/api/spaces').then(r => r.json()).then(data => {
    if (data.success) {
      const select = document.getElementById('spaceTypeId');
      select.innerHTML = '<option value="">Select space...</option>';
      data.data.forEach(space => {
        select.innerHTML += `<option value="${space.id}">${space.name}</option>`;
      });
    }
  });
}

function getStatusBadge(status) {
  const colors = {
    'pending': 'warning',
    'confirmed': 'success',
    'completed': 'info',
    'cancelled': 'danger'
  };
  const color = colors[status] || 'secondary';
  return `<span class="badge bg-${color}">${status}</span>`;
}

function loadReservations() {
  fetch('/admin/reservations/api/reservations').then(r => r.json()).then(data => {
    if (data.success) {
      // Desktop table
      const tbody = document.getElementById('reservations-body');
      tbody.innerHTML = '';

      // Mobile cards
      const cardContainer = document.getElementById('reservations-card-container');
      document.getElementById('reservations-count').innerText = `${data.data.length} record(s)`;

      if (!data.data.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-3">No reservations found.</td></tr>';
        cardContainer.innerHTML = '<p class="text-center text-muted py-4">No reservations found.</p>';
        return;
      }

      let cardHtml = '<div class="d-flex flex-column gap-2">';

      data.data.forEach(res => {
        const statusBadge = getStatusBadge(res.status);

        // Desktop row
        tbody.innerHTML += `
          <tr>
            <td>${res.customer_name}</td>
            <td>${res.customer_contact || '-'}</td>
            <td>${res.space}</td>
            <td>${res.reserved_date}</td>
            <td>${res.reserved_time}</td>
            <td>${res.duration_minutes} min</td>
            <td>${res.number_of_people}</td>
            <td>${statusBadge}</td>
            <td>
              <select class="form-select form-select-sm" onchange="updateStatus(${res.id}, this.value)">
                <option value="">Change...</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </td>
          </tr>
        `;

        // Mobile card
        cardHtml += `
          <div class="record-card">
            <div class="record-card-header">
              <div>
                <div class="record-card-title">${res.customer_name}</div>
                <div class="record-card-subtitle">${res.space}</div>
              </div>
              ${statusBadge}
            </div>
            <div class="record-card-body">
              <div class="record-card-row">
                <span class="record-card-label">Date:</span>
                <span class="record-card-value">${res.reserved_date}</span>
              </div>
              <div class="record-card-row">
                <span class="record-card-label">Time:</span>
                <span class="record-card-value">${res.reserved_time}</span>
              </div>
              <div class="record-card-row">
                <span class="record-card-label">Duration:</span>
                <span class="record-card-value">${res.duration_minutes} min</span>
              </div>
              <div class="record-card-row">
                <span class="record-card-label">People:</span>
                <span class="record-card-value">${res.number_of_people}</span>
              </div>
              <div class="record-card-row">
                <span class="record-card-label">Contact:</span>
                <span class="record-card-value">${res.customer_contact || '-'}</span>
              </div>
            </div>
            <div class="record-card-footer">
              <select class="form-select form-select-sm" onchange="updateStatus(${res.id}, this.value)">
                <option value="">Change status...</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
          </div>
        `;
      });

      cardHtml += '</div>';
      cardContainer.innerHTML = cardHtml;
    }
  });
}

function createReservation() {
  const payload = {
    customer_name: document.getElementById('customerName').value,
    customer_contact: document.getElementById('customerContact').value,
    space_type_id: document.getElementById('spaceTypeId').value,
    reserved_date: document.getElementById('reservedDate').value,
    reserved_time: document.getElementById('reservedTime').value,
    duration_minutes: document.getElementById('duration').value,
    number_of_people: document.getElementById('numPeople').value,
    notes: document.getElementById('notes').value,
  };

  fetch('/admin/reservations/api/reservations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => r.json()).then(data => {
    if (data.success) {
      showToast('Reservation created', 'success');
      bootstrap.Modal.getInstance(document.getElementById('addResModal')).hide();
      document.getElementById('customerName').value = '';
      document.getElementById('customerContact').value = '';
      document.getElementById('reservedDate').value = '';
      document.getElementById('reservedTime').value = '';
      document.getElementById('duration').value = '60';
      document.getElementById('numPeople').value = '1';
      document.getElementById('notes').value = '';
      loadReservations();
    } else {
      showToast('Error creating reservation', 'error');
    }
  });
}

function updateStatus(resId, status) {
  if (!status) return;
  fetch(`/admin/reservations/api/reservations/${resId}/status`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  }).then(r => r.json()).then(data => {
    if (data.success) {
      showToast('Reservation updated', 'success');
      loadReservations();
    } else {
      showToast('Error updating reservation', 'error');
    }
  });
}
</script>
{% endblock %}
