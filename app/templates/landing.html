{% extends "auth_layout.html" %}

{% block title %}IdeaHub{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card landing-card">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='css/images/logo.png') }}" alt="IdeaHub" class="login-logo mb-2" />
      <h1 class="brand-title mt-2 mb-2 visually-hidden">IdeaHub</h1>
      <p class="brand-subtitle mb-0">
        Idea Hub Coworking Space + Cafe
      </p>
    </div>

    <div class="d-grid gap-2 mt-4">
      <a href="/login" class="btn btn-login w-100">Login</a>
    </div>
  </div>
</div>
{% endblock %}
